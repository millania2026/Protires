# fly.toml app configuration file generated for protires on 2026-11-18T00:42:51Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'protires'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APPOINTMENT_CAPACITY = '1'
  DATABASE_BACKUP_DIR = '/data/backups'
  DATABASE_URL = 'file:/data/protires.db'
  NODE_ENV = 'production'
  PORT = '8080'
  PUBLIC_UPLOAD_DIR = '/data/uploads'
  TRUST_PROXY_HOPS = '1'

[[mounts]]
  source = 'protires_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
